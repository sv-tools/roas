# A document split across files. The root maps stay the index — the
# specification requires a root operation to name a channel in the root
# Channels Object — and it is the entries themselves that point out of
# this file, so the cross-reference checks have nothing local to resolve.
asyncapi: 3.1.0
info:
  title: Split across files
  version: 1.0.0
channels:
  user:
    $ref: './channels.yaml#/user'
operations:
  sendSignup:
    action: send
    channel:
      $ref: '#/channels/user'
    messages:
      - $ref: '#/channels/user/messages/signup'
components:
  messages:
    signup:
      $ref: './messages.yaml#/signup'
