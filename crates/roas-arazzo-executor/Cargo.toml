[package]
name = "roas-arazzo-executor"
version = "0.1.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["openapi", "arazzo", "workflow", "execute", "http"]
description = "Executes OpenAPI Arazzo workflows: runs every step's request and reports what happened"
readme = "README.md"
categories = ["web-programming", "command-line-utilities"]
include = ["src", "Cargo.toml", "README.md"]
publish = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Accept an Arazzo v1.0 description, upconverting it to v1.1 first.
# Without this only v1.1 descriptions can be executed.
v1_0 = ["roas-arazzo/v1_0"]
# Ready-made HTTP clients built on `reqwest` — blocking and async.
# Without this the caller supplies its own `HttpClient`.
reqwest = ["dep:reqwest", "dep:tokio"]

[dependencies]
roas-arazzo = { version = "0.3", path = "../roas-arazzo", features = ["v1_1"] }
regex.workspace = true
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }
serde_json.workspace = true
serde_json_path.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
enumset.workspace = true
serde_yaml_ng.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
