[package]
name = "roas-overlay"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["openapi", "overlay", "swagger", "jsonpath", "validation"]
description = "Rust implementation of the OpenAPI Overlay Specification v1.0 / v1.1 — parse, validate, and apply"
readme = "README.md"
categories = ["web-programming", "parser-implementations"]
include = ["src", "Cargo.toml", "README.md"]
publish = true

# Document every version module on docs.rs, not just the default one,
# so the `v1_0` / `v1_1` intra-doc links in the crate docs resolve.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["v1_1"]
# Support for OpenAPI Overlay v1.0.x.
v1_0 = []
# Support for OpenAPI Overlay v1.1.x (default). Independent of `v1_0`;
# enable both to get the additional `From<v1_0::Overlay> for
# v1_1::Overlay` upconversion impl.
v1_1 = []

# `clap::ValueEnum` impls for `apply::ApplyOptions` and
# `validation::ValidationOptions`, for downstream CLIs.
clap = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
enumset.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_path.workspace = true

[dev-dependencies]
serde_yaml_ng.workspace = true
