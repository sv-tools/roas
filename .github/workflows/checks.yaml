name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true
    outputs:
      publish:
        value: ${{ jobs.RustMeta.outputs.publish }}
      tag-package:
        value: ${{ jobs.RustMeta.outputs.tag-package }}
      tag-version:
        value: ${{ jobs.RustMeta.outputs.tag-version }}
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC

env:
  CARGO_TERM_COLOR: always

# Workflow-level permissions are deliberately narrow: every job here
# just clones the repo and runs cargo. Jobs that need more (e.g.
# `OsvScanner*` for SARIF upload) declare it per-job. Listing the
# workflow-level scopes explicitly also keeps reusable-workflow callers
# from having to grant more than is actually used — the GITHUB_TOKEN
# request from `workflow_call` is the union of this block and each
# job's own `permissions:`.
permissions:
  contents: read

jobs:
  RustMeta:
    name: Collect crate metadata
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.combined }}
      isolated: ${{ steps.split.outputs.isolated }}
      packages: ${{ steps.rustmeta.outputs.packages }}
      bin-packages: ${{ steps.rustmeta.outputs.bin-packages }}
      publish: ${{ steps.rustmeta.outputs.publish }}
      release-order: ${{ steps.rustmeta.outputs.release-order }}
      new-crates: ${{ steps.rustmeta.outputs.new-crates }}
      tag-package: ${{ steps.rustmeta.outputs.tag-package }}
      tag-version: ${{ steps.rustmeta.outputs.tag-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # On a `<crate>/v<x.y.z>` tag push (`release-stage.yaml` calls this
      # workflow) the action also parses the tag and fails when the crate
      # is unknown or its Cargo.toml version differs from the tag.
      - uses: sv-tools/rust-metadata-action@4020eda3b8b92b4cc9835dfe8d792ec2ace4690e # v1.3.1
        id: rustmeta
        with:
          matrix-exclude-features: roas:default
          matrix-mode: both
      # `both` emits the default-features rows and the
      # `--no-default-features` rows in one list; the build and test
      # matrices take the former, `IsolatedBuildJob` the latter.
      - name: Split the matrix by mode
        id: split
        env:
          ROWS: ${{ steps.rustmeta.outputs.matrix-include }}
        run: |
          set -euo pipefail
          {
            echo "combined=$(jq -c '[.[] | select(.mode == "combined") | .args]' <<<"$ROWS")"
            echo "isolated=$(jq -c '[.[] | select(.mode == "isolated")]' <<<"$ROWS")"
          } >> "$GITHUB_OUTPUT"
  BuildJob:
    name: Build per Package and Feature
    needs: RustMeta
    strategy:
        matrix:
            args: ${{ fromJSON(needs.RustMeta.outputs.matrix) }}
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo build ${{ matrix.args }} --all-targets --verbose
  IsolatedBuildJob:
    name: Build per Package with each Feature alone
    needs: RustMeta
    # The matrix above keeps default features on and does not deny
    # warnings, so a crate built with only an older version feature —
    # or with none at all — is never seen. That is where code left
    # behind a `cfg` shows up: unused, but only in a configuration
    # nothing builds. This builds each feature on its own, and no
    # features at all, with warnings denied.
    strategy:
      matrix:
        package: ${{ fromJSON(needs.RustMeta.outputs.packages) }}
    runs-on: "ubuntu-latest"
    # The rows come from the action's isolated matrix, but run one job
    # per package so the dependency tree is built once per crate rather
    # than once per row.
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Build with no features, then with each one alone
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          ROWS: ${{ needs.RustMeta.outputs.isolated }}
        run: |
          set -euo pipefail
          mapfile -t rows < <(jq -r --arg p "$PACKAGE" '.[] | select(.package == $p) | .args' <<<"$ROWS")
          for args in "${rows[@]}"; do
            echo "::group::${args}"
            # shellcheck disable=SC2086 # args is a list of flags
            cargo build $args --all-targets --verbose
            echo "::endgroup::"
          done
  Build:
    name: Wait for build jobs to finish
    needs: [BuildJob, IsolatedBuildJob]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build jobs succeeded"
  Format:
    name: Check Rust code formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo fmt --all --check --verbose
  Clippy:
    name: Check Rust code with Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo install-tools
      - run: cargo clippy --all-features --all-targets --verbose -- --deny warnings
      - run: cargo clippy --all-features --all-targets --quiet --message-format=json | cargo-action-fmt
        if: failure()
  Docs:
    name: Check rustdoc
    needs: RustMeta
    runs-on: ubuntu-latest
    env:
      # Broken intra-doc links, bare URLs and malformed HTML in doc
      # comments are warnings by default; docs.rs renders them wrong
      # rather than failing, so make them fatal here instead.
      RUSTDOCFLAGS: --deny warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      # Split by target kind: `roas-cli`'s binary is also named `roas`,
      # so documenting it alongside the `roas` library in one pass makes
      # both write `target/doc/roas/index.html` (rust-lang/cargo#6313).
      - run: cargo doc --workspace --all-features --no-deps --lib --verbose
      - name: Document the binaries
        env:
          BIN_PACKAGES: ${{ needs.RustMeta.outputs.bin-packages }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(jq -r '.[]' <<<"$BIN_PACKAGES")
          for package in "${packages[@]}"; do
            cargo doc --package "$package" --all-features --no-deps --bins --verbose
          done
  TestJob:
    name: Test per Package and Feature
    needs: RustMeta
    strategy:
      matrix:
        args: ${{ fromJSON(needs.RustMeta.outputs.matrix) }}
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      # `roas-codegen`'s Go backend needs `gofmt`, and its compile test
      # Go 1.27 or later; without them those tests skip themselves.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - run: cargo install-tools
      - name: Run tests
        run: cargo llvm-cov nextest ${{ matrix.args }} --all-targets --no-fail-fast --no-tests=pass --verbose
      # nextest does not execute doctests, so run them with the
      # standard test harness. Doctests don't contribute to the
      # llvm-cov report (stable `cargo llvm-cov` skips them), but they
      # must still be exercised — otherwise a v1_0-only doctest
      # against a v1_1-only feature combo silently never runs.
      #
      # Bin-only crates (e.g. `roas-cli`) have no library target, and
      # `cargo test --doc` bails with "no library targets found" before
      # it even starts. Treat that specific error as a skip; surface
      # every other failure.
      - name: Run doctests
        shell: bash
        run: |
          log=$(cargo test --doc ${{ matrix.args }} --no-fail-fast --verbose 2>&1) || rc=$?
          rc=${rc:-0}
          printf '%s\n' "$log"
          if [[ $rc -eq 0 ]]; then
            exit 0
          fi
          if grep -qF "no library targets found" <<< "$log"; then
            echo "::notice::doctests skipped — package has no library target"
            exit 0
          fi
          exit $rc
      - name: Prepare coverage report
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --lcov --output-path coverage.lcov
      # Not sent to Codecov from here: every upload makes Codecov
      # recompute its statuses from the reports it has so far, so a
      # matrix of uploads shows each component red until the last row
      # lands. The `Coverage` job below sends all of them at once.
      - name: Store coverage and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-test-${{ strategy.job-index }}
          path: |
            coverage.lcov
            target/nextest/default/junit.xml
          retention-days: 1
  CrossFeatureTestJob:
    name: Test cross-feature code
    # The matrix above is one row per feature, so code that compiles
    # only when two features are on together is never built there —
    # `roas-asyncapi`'s `v3_0::from_v2_6` needs `v2_6` *and* `v3_0`.
    # Run the crates that have such code with every feature on, so the
    # coverage report knows those lines exist.
    strategy:
      matrix:
        package: [roas-asyncapi]
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo install-tools
      - name: Run tests
        run: cargo llvm-cov nextest --package ${{ matrix.package }} --all-features --all-targets --no-fail-fast --no-tests=pass --verbose
      - name: Run doctests
        run: cargo test --doc --package ${{ matrix.package }} --all-features --no-fail-fast --verbose
      - name: Prepare coverage report
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --lcov --output-path coverage.lcov
      - name: Store coverage and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cross-${{ matrix.package }}
          path: |
            coverage.lcov
            target/nextest/default/junit.xml
          retention-days: 1
  GoBackendJob:
    name: Test the Go backend
    # The Go tests skip themselves without a toolchain, so a runner that
    # lost Go would pass silently. This job installs the latest Go and
    # sets `ROAS_CODEGEN_REQUIRE_GO`, which turns every such skip into a
    # failure: the generated Go must format, compile, vet and behave.
    runs-on: ubuntu-latest
    env:
      ROAS_CODEGEN_REQUIRE_GO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - run: go version
      - run: cargo install-tools
      - name: Run the Go backend tests
        run: |
          cargo nextest run --package roas-codegen --all-features --no-fail-fast \
            -E 'binary(go_test) | test(go) | test(gofmt)'
          cargo nextest run --package roas-cli --all-features --no-fail-fast -E 'test(go)'
  Coverage:
    name: Publish coverage to Codecov
    # One upload for the whole run, once every coverage-producing job
    # is done, so Codecov computes each status a single time from the
    # complete report. Runs after a test failure too, as the per-job
    # uploads used to. Deliberately not part of `AllChecks`: the
    # Codecov statuses are informational.
    needs: [TestJob, CrossFeatureTestJob]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Codecov resolves the report paths against the repository tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # One directory per artifact, so same-named reports from
          # different jobs don't overwrite each other.
          pattern: coverage-*
          path: coverage-reports
      - name: List the reports
        id: reports
        run: |
          set -euo pipefail
          mkdir -p coverage-reports
          list() { find coverage-reports -type f -name "$1" | sort | paste -sd, -; }
          echo "lcov=$(list coverage.lcov)" >> "$GITHUB_OUTPUT"
          echo "junit=$(list junit.xml)" >> "$GITHUB_OUTPUT"
          find coverage-reports -type f | sort
      - name: Upload coverage reports to Codecov
        if: ${{ steps.reports.outputs.lcov != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ steps.reports.outputs.lcov }}
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ steps.reports.outputs.junit != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: ${{ steps.reports.outputs.junit }}
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  Tests:
    name: Wait for testing jobs to finish
    needs: [TestJob, CrossFeatureTestJob, GoBackendJob]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Testing jobs succeeded"
  Deps:
    name: Check dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo install-tools
      - name: Deny
        run: cargo deny check all
  OsvScannerPR:
    name: OSV Scanner (PR diff)
    # Comparative scan: diffs base branch deps vs PR head, annotates
    # newly-introduced vulnerable deps on the PR. Only runs on
    # `pull_request` — on every other event `OsvScanner` below
    # performs a flat scan.
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write  # SARIF upload to the Security tab
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
  OsvScanner:
    name: OSV Scanner
    # Flat scan of the current tree. Runs on push (post-merge to
    # main), workflow_call (publish flow), and schedule. The PR
    # variant above handles `pull_request`.
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write  # SARIF upload to the Security tab
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
  PublishCrateJob:
    name: Test publishing bumped crates
    needs: RustMeta
    # `RustMeta.outputs.publish` is `'[]'` on commits that don't bump
    # any crate version (i.e. most PRs and main pushes), so gate the
    # whole job rather than letting an empty package list through.
    if: ${{ needs.RustMeta.outputs.publish != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      # Every bumped crate goes into ONE cargo invocation, rather than a
      # job per crate. A packaged crate has its `path` dependencies
      # stripped, so a per-crate run resolves siblings from crates.io and
      # a batch containing both a crate and a dependency of it that isn't
      # on the registry yet can never pass: the dependent's dry run asks
      # the index for a version that only exists in this checkout.
      # Splitting the batch by hand (`publish-exclude`) was the previous
      # workaround. Passing the whole set to one command instead lets
      # cargo stage the siblings into a temporary local registry under
      # `target/package/` and resolve them from there, and it orders the
      # uploads by dependency itself. Needs cargo 1.90+ for multi-package
      # publish.
      - name: Build the package flag list
        id: packages
        env:
          PUBLISH: ${{ needs.RustMeta.outputs.publish }}
        run: |
          set -euo pipefail
          flags="$(jq -j '.[] | "--package \(.) "' <<<"$PUBLISH")"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "batch: $flags"
      - name: Dry run publish
        run: cargo publish --all-features ${{ steps.packages.outputs.flags }} --dry-run --verbose
      # `publish.yaml` ships one crate per tag and resolves siblings from
      # crates.io, so the tags have to be pushed in dependency order, and
      # a crate's first version has to be published by hand: trusted
      # publishing cannot create a crate.
      - name: Report the release order
        env:
          RELEASE_ORDER: ${{ needs.RustMeta.outputs.release-order }}
          NEW_CRATES: ${{ needs.RustMeta.outputs.new-crates }}
        run: |
          set -euo pipefail
          {
            echo "### Release order"
            echo
            echo "One crate per tag, resolved from crates.io — push in this order:"
            echo
            echo '```sh'
            jq -r '.[] | "git push origin \(.)"' <<<"$RELEASE_ORDER"
            echo '```'
            if [[ "$NEW_CRATES" != "[]" ]]; then
              echo
              echo "Not on crates.io yet; run \`cargo publish\` by hand before pushing their tags:"
              echo
              jq -r '.[] | "- `\(.)`"' <<<"$NEW_CRATES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create packages
        run: cargo package --all-features ${{ steps.packages.outputs.flags }} --verbose
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One artifact for the batch: the crates are verified together,
          # so they are only meaningful together.
          name: packaged-crates
          path: target/package/*.crate
  Publish:
    name: Wait for publishing jobs to finish
    needs:
      - RustMeta
      - PublishCrateJob
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        if: ${{ needs.RustMeta.outputs.publish != '[]' && (needs.PublishCrateJob.result == 'failure' || needs.PublishCrateJob.result == 'cancelled') }}
        run: exit 1
  AllChecks:
    name: All checks
    needs:
      - Build
      - Format
      - Clippy
      - Docs
      - Tests
      - Deps
      - OsvScannerPR
      - OsvScanner
      - Publish
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # Exactly one of `OsvScannerPR` / `OsvScanner` is intentionally
      # skipped per event (PR vs non-PR), so a `skipped` result is
      # expected here. Every other entry in needs runs unconditionally
      # and surfaces as `failure` / `cancelled` if anything went wrong.
      - name: Verify all checks succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
