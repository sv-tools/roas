name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true
    outputs:
      publish:
        value: ${{ jobs.RustMeta.outputs.publish }}
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC

env:
  CARGO_TERM_COLOR: always

# Workflow-level permissions are deliberately narrow: every job here
# just clones the repo and runs cargo. Jobs that need more (e.g.
# `OsvScanner*` for SARIF upload) declare it per-job. Listing the
# workflow-level scopes explicitly also keeps reusable-workflow callers
# from having to grant more than is actually used — the GITHUB_TOKEN
# request from `workflow_call` is the union of this block and each
# job's own `permissions:`.
permissions:
  contents: read

jobs:
  RustMeta:
    name: Collect crate metadata
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.rustmeta.outputs.matrix }}
      packages: ${{ steps.rustmeta.outputs.packages }}
      publish: ${{ steps.rustmeta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sv-tools/rust-metadata-action@43e1de297f9236c81ae389dbc9d9e3b8c3451203 # v1.2.2
        id: rustmeta
        with:
          matrix-exclude-features: roas:default
  BuildJob:
    name: Build per Package and Feature
    needs: RustMeta
    strategy:
        matrix:
            args: ${{ fromJSON(needs.RustMeta.outputs.matrix) }}
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - run: cargo build ${{ matrix.args }} --all-targets --verbose
  IsolatedBuildJob:
    name: Build per Package with each Feature alone
    needs: RustMeta
    # The matrix above keeps default features on and does not deny
    # warnings, so a crate built with only an older version feature —
    # or with none at all — is never seen. That is where code left
    # behind a `cfg` shows up: unused, but only in a configuration
    # nothing builds. This builds each feature on its own, and no
    # features at all, with warnings denied.
    strategy:
      matrix:
        package: ${{ fromJSON(needs.RustMeta.outputs.packages) }}
    runs-on: "ubuntu-latest"
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Build with no features, then with each one alone
        shell: bash
        run: |
          set -euo pipefail
          package='${{ matrix.package }}'
          echo "::group::${package} (no features)"
          cargo build --package "$package" --no-default-features --all-targets --verbose
          echo "::endgroup::"
          # `default` is what the matrix above already builds.
          features=$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg p "$package" '.packages[]
                | select(.name == $p)
                | .features
                | keys[]
                | select(. != "default")')
          for feature in $features; do
            echo "::group::${package} --features=${feature}"
            cargo build --package "$package" --no-default-features --features "$feature" --all-targets --verbose
            echo "::endgroup::"
          done
  Build:
    name: Wait for build jobs to finish
    needs: [BuildJob, IsolatedBuildJob]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build jobs succeeded"
  Format:
    name: Check Rust code formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - run: cargo fmt --all --check --verbose
  Clippy:
    name: Check Rust code with Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - run: cargo install-tools
      - run: cargo clippy --all-features --all-targets --verbose -- --deny warnings
      - run: cargo clippy --all-features --all-targets --quiet --message-format=json | cargo-action-fmt
        if: failure()
  Docs:
    name: Check rustdoc
    runs-on: ubuntu-latest
    env:
      # Broken intra-doc links, bare URLs and malformed HTML in doc
      # comments are warnings by default; docs.rs renders them wrong
      # rather than failing, so make them fatal here instead.
      RUSTDOCFLAGS: --deny warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      # Split by target kind: `roas-cli`'s binary is also named `roas`,
      # so documenting it alongside the `roas` library in one pass makes
      # both write `target/doc/roas/index.html` (rust-lang/cargo#6313).
      - run: cargo doc --workspace --all-features --no-deps --lib --verbose
      - run: cargo doc --package roas-cli --all-features --no-deps --bins --verbose
  TestJob:
    name: Test per Package and Feature
    needs: RustMeta
    strategy:
      matrix:
        args: ${{ fromJSON(needs.RustMeta.outputs.matrix) }}
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - run: cargo install-tools
      - name: Run tests
        run: cargo llvm-cov nextest ${{ matrix.args }} --all-targets --no-fail-fast --no-tests=pass --verbose
      # nextest does not execute doctests, so run them with the
      # standard test harness. Doctests don't contribute to the
      # llvm-cov report (stable `cargo llvm-cov` skips them), but they
      # must still be exercised — otherwise a v1_0-only doctest
      # against a v1_1-only feature combo silently never runs.
      #
      # Bin-only crates (e.g. `roas-cli`) have no library target, and
      # `cargo test --doc` bails with "no library targets found" before
      # it even starts. Treat that specific error as a skip; surface
      # every other failure.
      - name: Run doctests
        shell: bash
        run: |
          log=$(cargo test --doc ${{ matrix.args }} --no-fail-fast --verbose 2>&1) || rc=$?
          rc=${rc:-0}
          printf '%s\n' "$log"
          if [[ $rc -eq 0 ]]; then
            exit 0
          fi
          if grep -qF "no library targets found" <<< "$log"; then
            echo "::notice::doctests skipped — package has no library target"
            exit 0
          fi
          exit $rc
      - name: Prepare coverage report
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --lcov --output-path coverage.lcov
      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          report_type: test_results
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  CrossFeatureTestJob:
    name: Test cross-feature code
    # The matrix above is one row per feature, so code that compiles
    # only when two features are on together is never built there —
    # `roas-asyncapi`'s `v3_0::from_v2_6` needs `v2_6` *and* `v3_0`.
    # Run the crates that have such code with every feature on, so the
    # coverage report knows those lines exist.
    strategy:
      matrix:
        package: [roas-asyncapi]
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - run: cargo install-tools
      - name: Run tests
        run: cargo llvm-cov nextest --package ${{ matrix.package }} --all-features --all-targets --no-fail-fast --no-tests=pass --verbose
      - name: Run doctests
        run: cargo test --doc --package ${{ matrix.package }} --all-features --no-fail-fast --verbose
      - name: Prepare coverage report
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --lcov --output-path coverage.lcov
      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          report_type: test_results
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  Tests:
    name: Wait for testing jobs to finish
    needs: [TestJob, CrossFeatureTestJob]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Testing jobs succeeded"
  Deps:
    name: Check dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - run: cargo install-tools
      - name: Machete
        run: cargo machete
      - name: Deny
        run: cargo deny check all
  OsvScannerPR:
    name: OSV Scanner (PR diff)
    # Comparative scan: diffs base branch deps vs PR head, annotates
    # newly-introduced vulnerable deps on the PR. Only runs on
    # `pull_request` — on every other event `OsvScanner` below
    # performs a flat scan.
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write  # SARIF upload to the Security tab
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
  OsvScanner:
    name: OSV Scanner
    # Flat scan of the current tree. Runs on push (post-merge to
    # main), workflow_call (publish flow), and schedule. The PR
    # variant above handles `pull_request`.
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write  # SARIF upload to the Security tab
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
  PublishCrateJob:
    name: Test publishing bumped crates
    needs: RustMeta
    # `RustMeta.outputs.publish` is `'[]'` on commits that don't bump
    # any crate version (i.e. most PRs and main pushes), so gate the
    # whole job rather than letting an empty package list through.
    if: ${{ needs.RustMeta.outputs.publish != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      # Every bumped crate goes into ONE cargo invocation, rather than a
      # job per crate. A packaged crate has its `path` dependencies
      # stripped, so a per-crate run resolves siblings from crates.io and
      # a batch containing both a crate and a dependency of it that isn't
      # on the registry yet can never pass: the dependent's dry run asks
      # the index for a version that only exists in this checkout.
      # Splitting the batch by hand (`publish-exclude`) was the previous
      # workaround. Passing the whole set to one command instead lets
      # cargo stage the siblings into a temporary local registry under
      # `target/package/` and resolve them from there, and it orders the
      # uploads by dependency itself. Needs cargo 1.90+ for multi-package
      # publish.
      - name: Build the package flag list
        id: packages
        env:
          PUBLISH: ${{ needs.RustMeta.outputs.publish }}
        run: |
          set -euo pipefail
          flags="$(jq -j '.[] | "--package \(.) "' <<<"$PUBLISH")"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "batch: $flags"
      - name: Dry run publish
        run: cargo publish --all-features ${{ steps.packages.outputs.flags }} --dry-run --verbose
      - name: Create packages
        run: cargo package --all-features ${{ steps.packages.outputs.flags }} --verbose
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One artifact for the batch: the crates are verified together,
          # so they are only meaningful together.
          name: packaged-crates
          path: target/package/*.crate
  Publish:
    name: Wait for publishing jobs to finish
    needs:
      - RustMeta
      - PublishCrateJob
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        if: ${{ needs.RustMeta.outputs.publish != '[]' && (needs.PublishCrateJob.result == 'failure' || needs.PublishCrateJob.result == 'cancelled') }}
        run: exit 1
  AllChecks:
    name: All checks
    needs:
      - Build
      - Format
      - Clippy
      - Docs
      - Tests
      - Deps
      - OsvScannerPR
      - OsvScanner
      - Publish
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # Exactly one of `OsvScannerPR` / `OsvScanner` is intentionally
      # skipped per event (PR vs non-PR), so a `skipped` result is
      # expected here. Every other entry in needs runs unconditionally
      # and surfaces as `failure` / `cancelled` if anything went wrong.
      - name: Verify all checks succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
