[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
authors = ["Sergey Vilgelm <sergey@vilgelm.com>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/sv-tools/roas"
repository = "https://github.com/sv-tools/roas"

[workspace.dependencies]
roas = { version = "0.22.0", path = "crates/roas", default-features = false }
roas-asyncapi = { version = "0.5", path = "crates/roas-asyncapi", default-features = false }
roas-codegen = { version = "0.1", path = "crates/roas-codegen" }
actix-web = { version = "4.15", default-features = false }
anyhow = "1.0.99"
axum = "0.8"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.1"
clap_mangen = "0.3.0"
enumset = "1.1.13"
http = "1.5"
http-body-util = "0.1"
lazy-regex = "3.6.0"
monostate = "1.0.0"
oxixml-infoset = "0.1.2"
oxixml-xpath = "0.1.2"
regex = "1.11.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"
serde_path_to_error = "0.1.20"
jsonschema = { version = "0.60", default-features = false }
serde_json_path = "0.7.2"
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
thiserror = "2.0.16"
toml = "1"
# `unstable_machinery` is minijinja's own parser, which roas-codegen uses to
# check user templates exactly as minijinja reads them. Its interface may
# change in any minor release, hence the `~` pin to 2.24.x.
minijinja = { version = "~2.24", features = ["loader", "multi_template", "preserve_order", "json", "unstable_machinery"] }
include_dir = "0.7"
syn = { version = "3", features = ["full", "parsing"] }
# ECMAScript's own regex grammar, for a schema's `pattern`. The two oxc
# crates move in lockstep, and 0.146 is the newest that builds on Rust 1.95.
oxc_regular_expression = "0.157"
oxc_allocator = "0.157"
tower = { version = "0.5", default-features = false }
notify = "8.2"
percent-encoding = "2.3.2"
poem = { version = "3.1", default-features = false }
rocket = { version = "0.5.1", default-features = false }
salvo_core = { version = "1.0", default-features = false }
notify-debouncer-mini = "0.7"
tokio = { version = "1.52", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
url = "2.5.8"
webbrowser = "1"
